# ============================================================
# Bitácora de Inversión Pública — despliegue on-premise
#
#   docker compose up -d --build
#
# La API se publica SOLO en loopback: el único que debe alcanzarla
# desde fuera es Caddy, que termina TLS en el host. Ver la sección de
# despliegue en docs/PLAN_MIGRACION_DOTNET_SQLSERVER.md.
#
# La cadena de conexión vive en .env (ignorado por git); .env.example
# tiene la plantilla.
# ============================================================

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: dnp-dpip-bitacora:latest
    container_name: dnp-dpip-bitacora
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Por omisión SOLO loopback: el único que debe alcanzar la API desde
      # fuera es Caddy, que termina TLS en el host.
      #
      # API_BIND=0.0.0.0 en .env la publica además por IP y puerto, para
      # llegar a ella sin pasar por el subdominio. Eso implica HTTP en
      # claro: por IP no hay forma de emitir un certificado. El contenido
      # ya es público, pero la conexión deja de ir cifrada.
      - "${API_BIND:-127.0.0.1}:${API_PUERTO:-5080}:8080"
    networks:
      # Se une a la red del SQL Server existente para alcanzarlo por el
      # alias de servicio 'sqlserver', sin depender del 1433 publicado.
      - umbraco-network

networks:
  umbraco-network:
    external: true
    name: sbn-ecp_umbraco-network
